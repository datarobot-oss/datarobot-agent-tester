---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test against'
        type: string
        default: '["3.11", "3.12", "3.13"]'
      working-directory:
        description: 'Directory to run task commands from (for monorepos)'
        type: string
        default: '.'

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions || '["3.11", "3.12", "3.13"]') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Taskfile
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task install

      - name: Run static checks
        run: task lint-check

      - name: Run tests
        run: task test
