[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dr_agents_tester"]

[project]
name = "datarobot-agent-tester"
version = "0.1.0"
description = "Generate, test, and improve AGENTS.md files and AI coding skills via the DataRobot LLM Gateway"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DataRobot", email = "oss-community-management@datarobot.com" }]
maintainers = [{ name = "Jeremy Johnson", email = "jeremy.johnson@datarobot.com" }]
requires-python = ">=3.11"
keywords = ["agents", "agents.md", "llm", "ai", "testing", "evaluation", "datarobot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Upper bound on litellm: 1.83.8+ regressed to a hard-pin of the
    # vulnerable aiohttp==3.13.3; 1.83.1–1.83.7 pin aiohttp==3.13.5 (patched).
    "litellm>=1.83.0,<1.83.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/datarobot-oss/datarobot-agent-tester"
Repository = "https://github.com/datarobot-oss/datarobot-agent-tester"
Issues = "https://github.com/datarobot-oss/datarobot-agent-tester/issues"

[project.scripts]
dr-agent = "dr_agents_tester.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", ".git", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
